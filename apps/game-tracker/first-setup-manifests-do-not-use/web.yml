apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: game-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-tracker-web
  template:
    metadata:
      labels:
        app: game-tracker-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/cel6586/game-tracker-web:v1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: game-tracker
spec:
  selector:
    app: game-tracker-web
  ports:
    - port: 8080
      targetPort: 8080

