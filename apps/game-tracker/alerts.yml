# Set up alerts using prometheus for when anything goes wrong
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRUle
metaData:
  name: game-tracker-alerts
  namespace: game-tracker
  labels:
    release: monitoring
spec:
  groups:
    - name: game-tracker
      rules:
        - alert: GameTrackerDeploymentDown
          expr: kube_deployment_status_replicas_available{namespace="game-tracker"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.deployment }} has no running pods"
        - alert: GameTrackerBackupMissing
          expr: time() - kube_cronjob_status_last_successful_time{namespace="game-tracker"} > 25 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Backup {{ $labels.cronjob }} has not succeeded in over 25 hours"