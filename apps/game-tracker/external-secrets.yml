# Pulls the game-tracker secrets out of Vault into Kubernetes Secrets, refreshed hourly.
#   game-tracker-secrets - db password and secret key
#   aws-backup           - credentials for the backup job
#   ghcr-pull            - login the pods use to pull images from GHCR
#   gitlab-pull          - login the pods use to pull images from the GitLab registry
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-tracker-secrets
  namespace: game-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: game-tracker-secrets
  dataFrom:
    - extract:
        key: game-tracker/app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-backup
  namespace: game-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: aws-backup
  dataFrom:
    - extract:
        key: game-tracker/aws-backup
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: game-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    # makes it a docker login secret so it can be used as an imagePullSecret
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: game-tracker/ghcr-pull
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-pull
  namespace: game-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-pull
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: game-tracker/gitlab-pull
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: local-backup
  namespace: game-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: local-backup
  dataFrom:
    - extract:
        key: game-tracker/local-backup