apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-tracker-secrets
  namespace: game-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: game-tracker-secrets
  dataFrom:
    - extract:
        key: game-tracker/app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-backup
  namespace: game-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: aws-backup
  dataFrom:
    - extract:
        key: game-tracker/aws-backup
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: game-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: game-tracker/ghcr-pull