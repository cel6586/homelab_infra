apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-ca
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cel6586/homelab_infra
    targetRevision: main
    path: apps/cert-manager/ca
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
