# Installs kube-prometheus-stack (Prometheus, Grafana, Alertmanager). Values are in apps/observability/values.yaml.
# Chart version is pinned. If you bump it, bump it in .github/workflows/checks.yml too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.17.0
      helm:
        valueFiles:
          - $repo/apps/observability/values.yaml
    - repoURL: https://github.com/cel6586/homelab_infra
      targetRevision: main
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # the CRDs are too big for a normal apply
      - ServerSideApply=true
