# Installs Loki, which stores the pod logs. Values are in apps/observability/loki-values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        valueFiles:
          - $repo/apps/observability/loki-values.yaml
    - repoURL: https://github.com/cel6586/homelab_infra
      targetRevision: main
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
