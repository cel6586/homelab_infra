# Applies the files in apps/external-secrets: the Vault store and the alertmanager secret.
# The operator itself is installed by external-secrets.yml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cel6586/homelab_infra
    targetRevision: main
    path: apps/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true