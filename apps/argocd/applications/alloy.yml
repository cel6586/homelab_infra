# Installs Alloy, which reads the pod logs and ships them to Loki.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.15.0
      helm:
        valueFiles:
          - $repo/apps/observability/alloy-values.yaml
    - repoURL: https://github.com/cel6586/homelab_infra
      targetRevision: main
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
