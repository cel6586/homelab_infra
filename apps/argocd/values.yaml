configs:
  params:
    server.insecure: true
  cm:
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      return hs

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.homelab.internal
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    tls: true