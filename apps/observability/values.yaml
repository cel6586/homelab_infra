# Values for the kube-prometheus-stack Helm chart (Prometheus, Grafana, Alertmanager).
# Anything not set here uses the chart's defaults.

grafana:
  persistence:
    enabled: true
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts:
      - grafana.homelab.internal
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.homelab.internal
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: microk8s-hostpath
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
alertmanager:
  alertmanagerSpec:
    # mounts the secret into the pod at /etc/alertmanager/secrets/alertmanager-discord/
    secrets:
      - alertmanager-discord
  config:
    route:
      receiver: discord
      group_by: [alertname, namespace]
      routes:
        # Watchdog always fires on purpose and InfoInhibitor is noise, send them nowhere
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/discord_webhook_url
