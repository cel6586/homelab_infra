# Tells External Secrets how to reach Vault. The ExternalSecrets point at this by name (vault).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      # plain http is fine, the traffic never leaves the cluster
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          # the role and policy live in Vault (read only on secret/data/game-tracker/*),
          # so any new secret has to be saved under game-tracker/ or it gets denied
          role: game-tracker
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
