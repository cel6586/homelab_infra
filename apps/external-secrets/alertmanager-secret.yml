# Gets the discord webhook secret from vault into kubernetes
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord
  dataFrom:
    - extract:
        key: game-tracker/alertmanager
