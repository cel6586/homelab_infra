# Gets the jenkins secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: jenkins-admin
  dataFrom:
    - extract:
        key: game-tracker/jenkins
