ui:
  enabled: true

server:
  dataStorage:
    storageClass: microk8s-hostpath
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts:
      - host: vault.homelab.internal
    tls:
      - secretName: vault-tls
        hosts:
          - vault.homelab.internal