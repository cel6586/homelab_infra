- name: Install MicroK8s on the k8 server
  hosts: k8s_server
  tasks:
    - name: Install Microk8s
      community.general.snap:
        name: microk8s
        classic: true

    - name: Let the ubuntu user run microk8s commands
      ansible.builtin.user:
        name: ubuntu
        groups: microk8s
        append: true

    - name: Wait until Microk8s is ready
      ansible.builtin.command: microk8s status --wait-ready
      changed_when: false

    - name: Enable add-ons
      ansible.builtin.command: microk8s enable dns hostpath-storage ingress
      changed_when: false