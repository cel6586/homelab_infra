# Installs docker services
- name: Install Docker Services
  hosts: docker_server
  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        update_cache: true

    - name: Start docker and keep it running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the ubuntu user run Docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Install the Python Docker library that Ansible needs
      ansible.builtin.apt:
        name: python3-docker

    - name: Run Uptime Kuma
      community.docker.docker_container:
        name: uptime-kuma
        image: louislam/uptime-kuma:2
        restart_policy: unless-stopped
        ports:
          - "3001:3001"
        volumes:
          - uptime-kuma:/app/data