# Builds the docker-services VM. Each service is a role in ../roles
# Run one service with: --tags <role name>
- name: Install Docker Services
  hosts: docker_server
  roles:
    - role: common
      tags: common
    - role: docker_base
      tags: docker_base
    - role: uptime_kuma
      tags: uptime_kuma
    - role: garage
      tags: garage
    - role: dozzle
      tags: dozzle
    - role: portainer
      tags: portainer
    - role: node_exporter
      tags: node_exporter
    - role: healthchecks
      tags: healthchecks
    - role: jellyfin
      tags: jellyfin
    - role: traefik
      tags: traefik
    - role: vaultwarden
      tags: vaultwarden
