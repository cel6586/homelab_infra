# Builds the gitlab VM. Each piece is a role in ../roles
# Run one role with: --tags <role name>
# docker_base must come before gitlab_runner, because the runner uses Docker.
# gitlab_backup uses the "Reconfigure GitLab" handler from the gitlab role, so it stays in this play.
# The AWS keys for the backup are in group_vars/gitlab_server/vault.yml, so run with --ask-vault-pass.
- name: Set up the gitlab server
  hosts: gitlab_server
  roles:
    - role: common
      tags: common
    - role: gitlab
      tags: gitlab
    - role: docker_base
      tags: docker_base
    - role: gitlab_runner
      tags: gitlab_runner
    # Backups turned off, I don't need them. Un-comment to turn them back on.
    # - role: gitlab_backup
    #   tags: gitlab_backup
