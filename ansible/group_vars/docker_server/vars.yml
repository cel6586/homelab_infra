# Variables for the docker_server group. The secret values are in vault.yml
# (encrypted with Ansible Vault); each name here points at its vault_ twin.
base_domain: deadlab.org
garage_rpc_secret: "{{ vault_garage_rpc_secret }}"
cloudflare_dns_token: "{{ vault_cloudflare_dns_token }}"
healthchecks_secret_key: "{{ vault_healthchecks_secret_key }}"
vaultwarden_backup_key_id: "{{ vault_vaultwarden_backup_key_id }}"
vaultwarden_backup_key_secret: "{{ vault_vaultwarden_backup_key_secret }}"
